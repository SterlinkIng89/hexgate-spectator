name: Issue Triage & Deduplication

on:
  issues:
    types: [opened]

permissions:
  issues: write
  models: read
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Semantic Triage & Deduplication
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const newIssue = context.payload.issue;

            const { data: recentIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 30,
              sort: 'created',
              direction: 'desc'
            });

            const candidates = recentIssues
              .filter(i => i.number !== newIssue.number && !i.pull_request)
              .map(i => ({
                number: i.number,
                title: i.title,
                state: i.state,
                body: (i.body || '').substring(0, 300)
              }));

            const prompt = `
              You are a repository issue triage assistant.
              Analyze the new issue and compare it against the list of recent issues.

              New Issue:
              - Number: #${newIssue.number}
              - Title: ${newIssue.title}
              - Body: ${newIssue.body || 'No description provided.'}

              Recent Issues to check for duplicates:
              ${JSON.stringify(candidates)}

              Tasks:
              1. Auto-label: Determine the best single label ('bug', 'enhancement', 'documentation', 'question').
              2. Format audit: Check if the issue has clear structure (Description, Expected/Actual, or Acceptance Criteria).
              3. Deduplication: Check if this new issue is semantically identical or closely duplicates any issue in Recent Issues.

              Respond strictly in JSON format:
              {
                "suggested_label": "bug|enhancement|documentation|question",
                "format_compliant": true or false,
                "format_feedback": "Short constructive note if false, otherwise empty.",
                "is_duplicate": true or false,
                "duplicate_issue_number": number or null,
                "duplicate_reason": "Brief explanation if duplicate, otherwise empty."
              }
            `;

            const response = await fetch('https://models.github.ai/inference/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'openai/gpt-4o-mini',
                messages: [{ role: 'user', content: prompt }],
                response_format: { type: "json_object" }
              })
            });
            if (!response.ok) {
              const errBody = await response.text();
              console.error('GitHub Models API returned status ' + response.status + ': ' + errBody);
              return;
            }
            const data = await response.json();
            const result = JSON.parse(data.choices[0].message.content);

            if (result.suggested_label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: newIssue.number,
                labels: [result.suggested_label]
              });
            }

            const feedbackLines = [];

            if (result.is_duplicate && result.duplicate_issue_number) {
              feedbackLines.push(`🔍 **Possible Duplicate Detected**\nThis issue appears closely related to #${result.duplicate_issue_number}.\n${result.duplicate_reason}`);
            }

            if (!result.format_compliant && result.format_feedback) {
              feedbackLines.push(`⚠️ **Format Notice**\n${result.format_feedback}\nPlease ensure standard sections (e.g., Description, Acceptance Criteria) are included.`);
            }

            if (feedbackLines.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: newIssue.number,
                body: feedbackLines.join('\n\n---\n\n')
              });
            }
